name: Publish to npm and PyPI

# Runs on every push to `main` (every PR merge) and on manual dispatch.
# Publishes the version in package.json to each registry only when it
# differs from the version already there.
#
# Trusted publishing (OIDC, no registry token secrets) is configured on
# npmjs.com and pypi.org for repo ksco92/arceus and workflow `publish.yml`.
# Neither registry binds a branch. Publishing is limited to `main` only while
# the `release` environment's deployment branches are limited to `main` (a
# repository setting) and both trusted publishers name environment `release`
# (registry settings).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      npm: ${{ steps.versions.outputs.npm }}
      pypi: ${{ steps.versions.outputs.pypi }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare package.json version against npm and PyPI
        id: versions
        working-directory: packages/cdk-glue-iceberg-table
        run: |
          local_version=$(node -p "require('./package.json').version")
          npm_version=$(npm view cdk-glue-iceberg-table version 2>/dev/null || echo "0.0.0")
          pypi_version=$(curl -fsSL "https://pypi.org/pypi/cdk-glue-iceberg-table/json" 2>/dev/null \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null \
            || echo "0.0.0")
          for registry in npm pypi; do
            registry_version=${npm_version}
            [ "$registry" = pypi ] && registry_version=${pypi_version}
            if [ "$local_version" = "$registry_version" ]; then
              echo "$registry=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$registry version $local_version already on registry, no publish."
            else
              echo "$registry=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Local $local_version differs from $registry $registry_version, publishing."
            fi
          done

  build:
    needs: check
    if: needs.check.outputs.npm == 'true' || needs.check.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pack the npm tarball
        working-directory: packages/cdk-glue-iceberg-table
        run: npm pack
      - name: Build Python distribution with jsii-pacmak
        run: npm run package:python --workspace cdk-glue-iceberg-table
      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: packages/cdk-glue-iceberg-table/*.tgz
          if-no-files-found: error
      - name: Upload Python distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: packages/cdk-glue-iceberg-table/dist/jsii/python/
          if-no-files-found: error

  publish-npm:
    needs: [check, build]
    if: needs.check.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # keep in step with .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with
      # setup-node is older.
      - run: npm install -g npm@12.2.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: npm-dist
      - run: npm publish ./npm-dist/*.tgz --ignore-scripts --access public --provenance

  publish-pypi:
    needs: [check, build]
    if: needs.check.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: python-dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python-dist/

  github-release:
    needs: [build, publish-npm, publish-pypi]
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/cdk-glue-iceberg-table/package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::Release v$version already exists, nothing to create."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $version" '/^## / { in_section = ($0 == heading); next } in_section' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no section '## $version' with release notes."
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$notes"
