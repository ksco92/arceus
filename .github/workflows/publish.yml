name: Publish to npm

# Runs on every push to `main` (i.e. every PR merge) and on manual
# dispatch. Publishes the version in package.json IF and ONLY IF it
# is newer than what is already on the npm registry. PRs that forget
# to bump `version` become no-ops here — per CLAUDE.md, the policy is
# "always bump", and a missing bump should be caught at review time.
#
# Authentication uses npm trusted publishing — the workflow exchanges
# its GitHub OIDC token for a short-lived npm credential. No long-lived
# `NPM_TOKEN` secret is needed; the trust is configured on the package
# at https://www.npmjs.com/package/cdk-glue-iceberg-table/access (the
# repo, workflow filename, and branch must match).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5.1 and Node
      # >= 22.14 per https://docs.npmjs.com/trusted-publishers.
      # The .nvmrc pin (Node 24 LTS) satisfies the Node side;
      # setup-node@v4 still ships an older npm with it, so upgrade
      # the CLI explicitly before any registry call.
      - run: npm install -g npm@latest
      # `npm ci` at the workspace root installs the package's deps too.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The version gate and the publish itself run inside the package
      # workspace, so `require('./package.json')` and `npm publish`
      # operate on packages/cdk-glue-iceberg-table — not the private
      # monorepo root manifest.
      - name: Compare package.json version against registry
        id: check
        working-directory: packages/cdk-glue-iceberg-table
        run: |
          local_version=$(node -p "require('./package.json').version")
          registry_version=$(npm view cdk-glue-iceberg-table version 2>/dev/null || echo "0.0.0")
          echo "local=$local_version"       >> "$GITHUB_OUTPUT"
          echo "registry=$registry_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" = "$registry_version" ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::Version $local_version already on registry — no publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Local $local_version differs from registry $registry_version — publishing."
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/cdk-glue-iceberg-table
        run: npm publish --access public --provenance
