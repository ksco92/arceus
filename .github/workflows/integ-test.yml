name: Integration test

# Runs the Spark smoke check and the evolution, DML, surface, v3-evolution,
# and v3 DML scripts against real AWS: real `cdk deploy`s plus Spark
# queries through the IcebergTable construct, and Athena queries against
# the v2 tables of the evolution, DML, and surface scripts.
#
# Triggers:
#   - Label `run-integ-test` applied to an open PR.
#   - Comment `/run-integ-test` on a PR (by repo collaborators).
#   - Manual dispatch from the Actions tab.
#   - Weekly schedule, against `main`.
#
# A run started from a PR sets the `integ-gate` commit status on the PR head
# SHA the suites ran on (see integ-gate.yml).
#
# Not on every push: real AWS resources, real cost, and about 20 min with
# the Spark downloads cached and up to about 45 min without.
#
# Requires the `AWS_INTEG_ROLE_ARN` repo variable and an IAM role
# trust-policied for this repo's GitHub Actions OIDC. See
# `docs/integ-test-setup.md` for the prerequisites
# (`ArceusStack` must already be deployed; the account must be
# cdk-bootstrapped) and the exact trust + permissions policies.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

# Single global slot — the job deploys fixed-name CloudFormation stacks
# (`IcebergSparkSmokeStack`, `IcebergEvolutionStack`, `IcebergDmlStack`,
# `IcebergSurfaceStack`, `IcebergV3EvolutionStack`, `IcebergV3DmlStack`)
# to one account/region, so two concurrent runs would race on the same
# stacks and Glue tables. Don't cancel in-progress: an interrupted run
# leaves stacks partially deployed.
concurrency:
  group: integ-test-stacks
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    # Decide whether this trigger should actually run the deploy job.
    # Rules (a schedule event always runs, with no PR number):
    #
    # 1. Labels and comments only fire when the PR's head branch
    #    lives in the same repo, not a fork. This is the
    #    "pwn-request" guard — a malicious fork PR could otherwise
    #    edit package.json's postinstall, scripts/integration-test-
    #    evolution.sh, or bin/arceus.ts, and the workflow would run
    #    that code with cloud-admin credentials. Fork PRs need
    #    manual `workflow_dispatch` after a human reviews the diff.
    #
    # 2. Comment trigger requires both an exact `/run-integ-test`
    #    body (trimmed whitespace) and an OWNER/MEMBER/COLLABORATOR
    #    association.
    #
    # 3. Label trigger requires the label name to equal
    #    `run-integ-test`.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_REPO_FULL: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_FULL: ${{ github.repository }}
        run: |
          head_sha="$EVENT_HEAD_SHA"
          trimmed_comment="$(echo "$COMMENT_BODY" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          if [ "$EVENT" = "schedule" ]; then
            echo "::notice::weekly schedule — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice::workflow_dispatch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ] \
            && [ "$LABEL" = "run-integ-test" ] \
            && [ "$PR_REPO_FULL" = "$REPO_FULL" ]; then
            echo "::notice::label trigger from same-repo PR — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ] && [ "$LABEL" = "run-integ-test" ]; then
            echo "::warning::label trigger from fork PR ($PR_REPO_FULL) — refusing. Use workflow_dispatch after review."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "issue_comment" ] \
            && [ "$IS_PR" = "true" ] \
            && [ "$trimmed_comment" = "/run-integ-test" ] \
            && { [ "$COMMENT_ASSOC" = "OWNER" ] || [ "$COMMENT_ASSOC" = "MEMBER" ] || [ "$COMMENT_ASSOC" = "COLLABORATOR" ]; }; then
            # `github.event.pull_request` is unpopulated on issue_comment
            # events, so `PR_REPO_FULL` is empty here. Fetch the head-repo
            # full name and head SHA from the API and gate on same-repo to
            # close the pwn-request hole the label branch already closes
            # above. The SHA is read once here; every later step uses it
            # rather than the movable PR ref.
            read -r pr_repo head_sha < <(gh api "repos/$REPO_FULL/pulls/$PR_NUMBER" --jq '"\(.head.repo.full_name) \(.head.sha)"')
            if [ "$pr_repo" = "$REPO_FULL" ]; then
              echo "::notice::collaborator comment trigger from same-repo PR — running."
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::collaborator comment trigger from fork PR ($pr_repo) — refusing. Use workflow_dispatch after review."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" = "issue_comment" ] && [ "$IS_PR" = "true" ]; then
            echo "::warning::comment trigger ignored — body='$trimmed_comment', assoc=$COMMENT_ASSOC. Expected exact '/run-integ-test' from OWNER/MEMBER/COLLABORATOR."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: us-east-1
      PRINCIPAL_ARN: ${{ vars.AWS_INTEG_ROLE_ARN }}
      DESTROY: '1'
      ATHENA_WORKGROUP: primary
    steps:
      - uses: actions/checkout@v7
        with:
          # For PRs triggered by label/comment, GITHUB_REF points at
          # `main`; check out the head SHA the gate resolved.
          ref: ${{ needs.gate.outputs.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INTEG_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .spark/downloads
          key: spark-${{ hashFiles('scripts/spark/install-spark.sh', 'scripts/spark/spark-env.sh') }}
      - run: bash scripts/spark/install-spark.sh
      - name: Run integration test — Spark smoke (1 deploy + INSERT/SELECT through S3FileIO)
        run: |
          set -o pipefail
          bash scripts/integration-test-spark-smoke.sh 2>&1 | tee /tmp/integ-test.log
      - name: Run integration test — evolution (deploys + Spark and Athena verify)
        run: |
          set -o pipefail
          bash scripts/integration-test-evolution.sh 2>&1 | tee -a /tmp/integ-test.log
      - name: Run integration test — DML via Spark and Athena (1 deploy + UPDATE/DELETE/MERGE/time-travel/compaction/expiry)
        run: |
          set -o pipefail
          bash scripts/integration-test-dml.sh 2>&1 | tee -a /tmp/integ-test.log
      - name: Run integration test — surface (transforms / sort / nested types via Spark and Athena / grantRead and grantReadWrite under assumed roles)
        run: |
          set -o pipefail
          bash scripts/integration-test-surface.sh 2>&1 | tee -a /tmp/integ-test.log
      - name: Run integration test — v3 evolution (4 deploys + metadata.json assertions)
        run: |
          set -o pipefail
          bash scripts/integration-test-v3-evolution.sh 2>&1 | tee -a /tmp/integ-test.log
      - name: Run integration test — v3 DML (1 deploy + Spark deletion vectors / row lineage / variant / v2 to v3 upgrade; geo columns from metadata.json)
        run: |
          set -o pipefail
          bash scripts/integration-test-v3-dml.sh 2>&1 | tee -a /tmp/integ-test.log
      - name: Comment status on PR
        if: always() && needs.gate.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const status = process.env.JOB_STATUS;
            const pr = Number(process.env.PR_NUMBER);
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let tail = '';
            try {
              const log = fs.readFileSync('/tmp/integ-test.log', 'utf8').replace(/(?<!\d)\d{12}(?!\d)/g, '<account>');
              tail = log.split('\n').slice(-40).join('\n').slice(-3500);
            } catch (e) {
              // Log file may not exist if the run failed before the script started.
            }
            const tailBlock = tail
              ? `\n\n<details><summary>Last lines of script output</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n</details>`
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: `Integration test: **${status}**. [Run log](${run}).${tailBlock}`,
            });

  report:
    needs: [gate, deploy]
    if: always() && needs.gate.outputs.run == 'true' && needs.gate.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            state=success
            description="Integration test run passed on this commit"
          else
            state=failure
            description="Integration test run $DEPLOY_RESULT on this commit"
          fi
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" -f context=integ-gate \
            -f description="$description" -f target_url="$RUN_URL"

  notify-failure:
    needs: deploy
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Weekly integration run failed
    steps:
      - run: |
          body="The weekly integration run on main failed: $RUN_URL"
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
