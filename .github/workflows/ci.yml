name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    # Checks out the merge commit, so HEAD^1 is the base branch tip.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/release-policy.js HEAD^1 HEAD

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The root README is the consumer doc, kept byte-identical to the
      # package README so the GitHub landing page and the npm/PyPI page
      # never drift. `diff` exits non-zero (failing CI) if they differ.
      - name: Verify root and package READMEs are in sync
        run: diff README.md packages/cdk-glue-iceberg-table/README.md
      - run: npm run lint
      # Package unit tests (with the 95% coverage gate) and the demo
      # stack tests. `npm test` runs both via the root script.
      - run: npm test
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: packages/cdk-glue-iceberg-table/build/coverage/lcov.info
          # Required because `main` is a protected branch. Codecov's
          # tokenless-uploads-for-public-repos path is disabled on
          # protected branches as an anti-abuse measure.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # `npm run build` invokes jsii (not tsc) and emits the compiled
      # JS/d.ts plus the `.jsii` assembly that Construct Hub indexes.
      - run: npm run build
      # Prove the multi-language packaging works end to end: jsii-pacmak
      # builds the Python wheel + sdist from the assembly. This is the
      # same command the publish workflow runs before the PyPI upload, so
      # a packaging break surfaces on the PR, not at release time.
      - name: Build Python distribution with jsii-pacmak
        run: npm run package:python --workspace cdk-glue-iceberg-table
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install the built wheel and run the README Python examples
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install packages/cdk-glue-iceberg-table/dist/jsii/python/*.whl
          "$RUNNER_TEMP/smoke/bin/python" packages/cdk-glue-iceberg-table/test/python-smoke/smoke.py
      - name: npm pack dry-run on the published package
        run: npm pack --dry-run
        working-directory: packages/cdk-glue-iceberg-table

  e2e-consumer:
    # Proves the published cdk-glue-iceberg-table package is importable
    # by a downstream CDK app. Pinned to a specific version in
    # e2e-consumer/package.json so a bad publish breaks this job on
    # the follow-up PR after the next release, not silently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e-consumer/package-lock.json
      - run: npm ci
      - run: npx cdk synth --no-staging
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-east-1

  packed-consumer:
    # Installs this PR's own `npm pack` tarball into a fixture that lives
    # with the package, outside the workspace so resolution cannot fall
    # back to the source tree, then compiles and synthesizes it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the package and install the tarball into the fixture
        run: |
          tarball="$RUNNER_TEMP/$(cd packages/cdk-glue-iceberg-table && npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          tar -tzf "$tarball" | grep -qx package/.jsii
          cp -R packages/cdk-glue-iceberg-table/test/packed-consumer "$RUNNER_TEMP/packed-consumer"
          cd "$RUNNER_TEMP/packed-consumer"
          npm install "$tarball"
      - name: Compile and synthesize the fixture
        working-directory: ${{ runner.temp }}/packed-consumer
        run: npx tsc && node out/app.js

  peer-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the declared peer floors
        run: |
          floor() { node -p "require('./packages/cdk-glue-iceberg-table/package.json').peerDependencies['$1'].replace(/^[^0-9]*/, '')"; }
          npm install --no-save "aws-cdk-lib@$(floor aws-cdk-lib)" "constructs@$(floor constructs)"
          for pkg in aws-cdk-lib constructs; do
            [ "$(cd packages/cdk-glue-iceberg-table && node -p "require('$pkg/package.json').version")" = "$(floor $pkg)" ]
          done
      - run: npm test --workspace cdk-glue-iceberg-table
