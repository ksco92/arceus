name: Integration gate

# Posts the `integ-gate` commit status on each PR head: success when no
# changed file is in the trigger set (.github/integ-trigger-set.txt), pending
# when one is. integ-test.yml sets success or failure on the SHA its suites
# ran on. Mark `integ-gate` as a required status check in branch protection.
#
# Fork PRs get a read-only token and post nothing.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: integ-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {classify} = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/integ-gate.js`);
            const patternsText = fs.readFileSync('.github/integ-trigger-set.txt', 'utf8');
            await classify({github, context, core, patternsText});
