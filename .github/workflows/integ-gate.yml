name: Integration gate

# Posts the `integ-gate` commit status for each PR to main from the trigger
# set in .github/integ-trigger-set.txt; integ-test.yml posts the run result.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  classify:
    if: github.event.action != 'edited' || github.event.changes.base != null
    concurrency:
      group: integ-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const {classify} = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/integ-gate.js`);
            const patternsText = fs.readFileSync('.github/integ-trigger-set.txt', 'utf8');
            await classify({github, context, core, patternsText});
